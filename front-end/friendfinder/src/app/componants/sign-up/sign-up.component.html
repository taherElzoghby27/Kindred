<div class="signup-container">
  <h2>Create Account</h2>

  <div class="form-group">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required [(ngModel)]="signupData.username" (input)="clear()" />
    @if (usernameError !== '') {
    <div class="error">{{ usernameError }}</div>
    }
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input id="email" name="email" type="text" required [(ngModel)]="signupData.email" (input)="clear()" />
    @if (emailError !== '') {
    <div class="error">{{ emailError }}</div>
    }
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="6" [(ngModel)]="signupData.password"
      (input)="clear()" />
    @if (passwordError !== '') {
    <div class="error" *ngIf="">{{ passwordError }}</div>
    }
  </div>

  <div class="form-group">
    <label for="confirm_password">Confirm Password</label>
    <input id="confirm_password" name="confirm_password" type="password" required minlength="6"
      [(ngModel)]="signupData.confirmPassword" (input)="clear()" />
    @if (confirmPasswordError !== '') {
    <div class="error">{{ confirmPasswordError }}</div>
    }
  </div>
  <app-button text="Sign Up" (onClick)="onSubmit()"></app-button>
  <app-auth-redirect text="Already have an account?" textButton="Login" textOnClick="/login">
  </app-auth-redirect>
  @if (errorBackend) {
  <div class="error-message">
    <span class="error-icon">⚠️</span>
    <div class="error-text">
      <div class="error-ar">{{ errorMessageAr }}</div>
      <div class="error-en">{{ errorMessageEn }}</div>
    </div>
  </div>
  }
</div>
